name: Verify production static export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: "/"
          NEXT_PUBLIC_SITE_URL: https://english.xn--9iq784ays8a.com/
          NEXT_PUBLIC_NIHONGO_URL: https://nihongo.xn--9iq784ays8a.com/
      - run: npm run verify:pages
        env:
          GITHUB_PAGES_BASE_PATH: "/"
      - uses: actions/upload-artifact@v4
        with:
          name: production-static-site
          path: out
