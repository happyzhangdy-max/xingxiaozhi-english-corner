name: Bug report
description: Report a reproducible product problem (not a security issue).
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the action, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
